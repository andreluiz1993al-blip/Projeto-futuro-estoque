<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Estoque APP — Gestão Inteligente</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0F294A">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #E2E8F0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes scanline {
      0% { top: 12%; }
      50% { top: 85%; }
      100% { top: 12%; }
    }
    .animate-scan {
      animation: scanline 2.6s ease-in-out infinite;
    }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('Erro SW:', err));
      });
    }
  </script>
</head>
<body class="min-h-screen flex justify-center items-start sm:py-6">

  <div id="app" class="w-full max-w-[420px] min-h-screen sm:min-h-[844px] sm:h-[844px] bg-[#F4F6F9] sm:rounded-[38px] sm:shadow-2xl sm:border-[8px] sm:border-[#1E293B] overflow-hidden flex flex-col relative">

    <!-- TELA DE LOGIN / AUTENTICAÇÃO -->
    <div id="screen-auth" class="screen hidden absolute inset-0 bg-[#0F294A] text-white p-6 justify-between overflow-hidden z-50 flex flex-col">
      <div class="pt-8 text-center">
        <div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-lg">
          <i data-lucide="lock" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">Estoque APP</h1>
        <p id="auth-subtitle" class="text-xs text-blue-200 mt-1">Faça login para gerenciar o seu estoque</p>
      </div>

      <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl space-y-4">
        <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
          <button id="tab-login-btn" onclick="switchAuthMode('login')" class="py-2 rounded-lg bg-white text-slate-900 shadow-sm transition">Entrar</button>
          <button id="tab-register-btn" onclick="switchAuthMode('register')" class="py-2 rounded-lg text-slate-500 transition">Cadastrar</button>
        </div>

        <div id="register-fields" class="hidden space-y-3">
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nome Completo</label>
            <input id="auth-name" type="text" placeholder="André Luiz" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-600" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">E-mail</label>
          <input id="auth-email" type="email" placeholder="seu@email.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-600" />
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Senha</label>
          <input id="auth-pass" type="password" placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-600" />
        </div>

        <button id="auth-submit-btn" onclick="handleAuthSubmit()" class="w-full py-3 rounded-xl bg-[#2563EB] hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm shadow-md shadow-blue-600/25 transition">
          Entrar na Conta
        </button>
      </div>

      <div class="text-center pb-4">
        <p class="text-[11px] text-blue-300">Protegido por criptografia local • Estoque APP</p>
      </div>
    </div>

    <!-- TELA DE VERIFICAÇÃO DE CÓDIGO (2FA / OTP POR E-MAIL) -->
    <div id="screen-otp" class="screen hidden absolute inset-0 bg-[#0F294A] text-white p-6 justify-between overflow-hidden z-50 flex flex-col">
      <div class="pt-8 text-center">
        <div class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-lg">
          <i data-lucide="mail-check" class="w-8 h-8 text-white"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight">Verificação de E-mail</h1>
        <p class="text-xs text-blue-200 mt-1">Enviamos um código de segurança de 6 dígitos para o seu e-mail.</p>
      </div>

      <div class="bg-white text-slate-800 p-6 rounded-3xl shadow-2xl space-y-4">
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Código de Acesso (6 dígitos)</label>
          <input id="otp-input" type="text" maxlength="6" placeholder="000000" class="w-full text-center tracking-[1em] font-mono text-xl bg-slate-50 border border-slate-200 rounded-xl px-3 py-3 focus:outline-none focus:border-blue-600" />
        </div>

        <button onclick="verifyOtpCode()" class="w-full py-3 rounded-xl bg-[#2563EB] hover:bg-blue-700 active:scale-[0.99] text-white font-semibold text-sm shadow-md shadow-blue-600/25 transition">
          Confirmar e Entrar
        </button>

        <div class="text-center pt-2">
          <button onclick="resendOtpCode()" class="text-xs text-blue-600 font-semibold hover:underline">Reenviar código</button>
        </div>
      </div>

      <div class="text-center pb-4">
        <button onclick="backToAuth()" class="text-xs text-blue-300 hover:underline">← Voltar para o login</button>
      </div>
    </div>

    <!-- TELA 1: INÍCIO -->
    <div id="screen-inicio" class="screen flex-1 flex flex-col overflow-hidden">
      <header class="bg-[#0F294A] text-white px-5 pt-6 pb-5 rounded-b-[24px] shadow-md shrink-0">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center border border-white/20">
              <i data-lucide="package" class="w-5 h-5 text-white"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">Estoque APP</span>
          </div>
          <button onclick="openNotifications()" class="relative p-2 rounded-full hover:bg-white/10 transition">
            <i data-lucide="bell" class="w-5 h-5 text-white"></i>
            <span id="notif-dot" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-rose-500 rounded-full border-2 border-[#0F294A]"></span>
          </button>
        </div>

        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-400 to-teal-300 flex items-center justify-center text-[#0F294A] font-bold text-sm shadow">
              <span id="user-initials">AL</span>
            </div>
            <div>
              <p class="text-xs text-blue-200">Bem-vindo de volta,</p>
              <h2 id="user-greeting" class="
