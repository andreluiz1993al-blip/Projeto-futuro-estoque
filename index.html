<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EstoquePro</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#F3F5F8;color:#111827;padding-bottom:80px}
header{background:#0B2241;color:#fff;padding:16px;display:flex;align-items:center;gap:10px;font-weight:700;position:sticky;top:0;z-index:50}
.scr{display:none;padding:16px}.scr.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}
.kpi{padding:12px 8px;border-radius:12px;color:#fff}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}
.act{background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:14px 5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;font-size:.8rem}
.box,.p-card,.card{background:#fff;border-radius:14px;padding:12px;border:1px solid #E5E7EB;margin-bottom:10px}
.h-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #F3F4F6}
.p-card{display:flex;justify-content:space-between;align-items:center}
.fab{position:fixed;bottom:80px;right:18px;width:54px;height:54px;border-radius:50%;background:#2563EB;color:#fff;border:none;font-size:1.8rem;z-index:45}
nav{position:fixed;bottom:0;left:0;right:0;height:65px;background:#fff;border-top:1px solid #E5E7EB;display:grid;grid-template-columns:repeat(5,1fr);z-index:60}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.7rem;color:#6B7280}
nav button.on{color:#2563EB;font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.on{display:flex}
.m-box{background:#fff;width:100%;max-width:350px;border-radius:16px;padding:18px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid #E5E7EB;margin:6px 0 12px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;background:#2563EB;color:#fff;font-weight:700;margin-top:5px}
.pill{padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:700}
.ok{background:#CCFBF1;color:#0F766E}.low{background:#FEE2E2;color:#B91C1C}
</style>
</head>
<body>
<header><span>📦</span><span id="hTitle">EstoquePro</span></header>

<section id="s-home" class="scr on">
  <div style="font-weight:600;margin-bottom:10px">Olá, Amanda Silva</div>
  <div class="kpis">
    <div class="kpi" style="background:#2A8C82"><small>Itens</small><strong id="kTot">0</strong></div>
    <div class="kpi" style="background:#DC6B5A"><small>Baixo</small><strong id="kLow">0</strong></div>
    <div class="kpi" style="background:#2463EB"><small>Valor</small><strong id="kVal">R$ 0</strong></div>
  </div>
  <div class="acts">
    <button class="act" onclick="openMov('in')">➕ Entrada</button>
    <button class="act" onclick="openMov('out')">➖ Saída</button>
    <button class="act" onclick="go('scan')">📷 Leitor</button>
  </div>
  <div style="font-weight:700;margin-bottom:8px">Movimentações</div>
  <div class="box" id="hList"></div>
</section>

<section id="s-stock" class="scr">
  <input id="qStock" placeholder="🔍 Pesquisar..." oninput="drawStock()">
  <div id="pList"></div>
  <button class="fab" onclick="openNew()">+</button>
</section>

<section id="s-scan" class="scr">
  <div class="card">
    <h4 id="scName">Produto</h4>
    <p id="scSku" style="color:#6B7280;font-size:.8rem;margin-bottom:10px"></p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:15px 0">
      <span>Atual: <strong id="scQty">0</strong></span>
      <div>
        <button onclick="chgD(-1)" style="padding:5px 12px">-</button>
        <strong id="scDelta" style="margin:0 10px">1</strong>
        <button onclick="chgD(1)" style="padding:5px 12px">+</button>
      </div>
    </div>
    <button class="btn" onclick="addScan()">✓ Adicionar ao Estoque</button>
    <button class="btn" style="background:#E5E7EB;color:#111" onclick="simScan()">Trocar Produto ↻</button>
  </div>
</section>

<section id="s-rep" class="scr">
  <div class="card">
    <h4>Exportar Dados</h4>
    <button class="btn" onclick="csvOut()">Baixar Planilha CSV</button>
  </div>
</section>

<section id="s-prof" class="scr">
  <div class="card">
    <h4>Amanda Silva</h4>
    <button class="btn" style="background:#DC2626" onclick="localStorage.clear();location.reload()">Resetar Tudo</button>
  </div>
</section>

<nav>
  <button id="n-home" class="on" onclick="go('home')">🏠<br>Início</button>
  <button id="n-stock" onclick="go('stock')">📦<br>Estoque</button>
  <button id="n-scan" onclick="go('scan')">📷<br>Leitor</button>
  <button id="n-rep" onclick="go('rep')">📈<br>Relat.</button>
  <button id="n-prof" onclick="go('prof')">👤<br>Perfil</button>
</nav>

<div class="modal" id="modProd">
  <div class="m-box">
    <h4 id="mTitle">Produto</h4>
    <input type="hidden" id="mId">
    <input id="mN" placeholder="Nome">
    <input id="mS" placeholder="SKU">
    <input id="mQ" type="number" placeholder="Quantidade">
    <input id="mP" type="number" step="0.01" placeholder="Preço">
    <button class="btn" onclick="saveProd()">Salvar</button>
    <button class="btn" id="btnDel" style="background:#DC2626;display:none" onclick="delProd()">Excluir</button>
    <button class="btn" style="background:#E5E7EB;color:#111" onclick="closeAll()">Fechar</button>
  </div>
</div>

<div class="modal" id="modMov">
  <div class="m-box">
    <h4 id="movTitle">Movimentar</h4>
    <select id="movSel"></select>
    <input id="movQ" type="number" value="1">
    <button class="btn" onclick="saveMov()">Confirmar</button>
    <button class="btn" style="background:#E5E7EB;color:#111" onclick="closeAll()">Fechar</button>
  </div>
</div>

<script>
let prods=JSON.parse(localStorage.getItem("ep_p"))||[
  {id:1,n:"Fone JBL",s:"ELE-01",q:10,m:5,p:299},
  {id:2,n:"Mochila Tech",s:"ACS-02",q:3,m:5,p:189}
];
let hist=JSON.parse(localStorage.getItem("ep_h"))||[];
let cur=prods[0],delta=1,movType="in";

function sync(){
  localStorage.setItem("ep_p",JSON.stringify(prods));
  localStorage.setItem("ep_h",JSON.stringify(hist));
  drawHome();drawStock();
}
function drawHome(){
  document.getElementById("kTot").innerText=prods.reduce((a,b)=>a+b.q,0);
  document.getElementById("kLow").innerText=prods.filter(x=>x.q<=x.m).length;
  document.getElementById("kVal").innerText="R$ "+prods.reduce((a,b)=>a+b.q*b.p,0).toFixed(0);
  document.getElementById("hList").innerHTML=hist.slice(0,5).map(h=>`<div class="h-item"><span>${h.p}</span><strong>${h.q}</strong></div>`).join("")||"Sem registros";
}
function drawStock(){
  let q=document.getElementById("qStock").value.toLowerCase();
  document.getElementById("pList").innerHTML=prods.filter(p=>p.n.toLowerCase().includes(q)).map(p=>`
    <div class="p-card" onclick="editProd(${p.id})">
      <div><strong>${p.n}</strong><br><small>${p.s}</small> <span class="pill ${p.q<=p.m?'low':'ok'}">${p.q} un</span></div>
      <strong>R$ ${p.p}</strong>
    </div>`).join("");
}
function go(t){
  document.querySelectorAll(".scr").forEach(x=>x.classList.remove("on"));
  document.getElementById("s-"+t).classList.add("on");
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.getElementById("n-"+t).classList.add("on");
}
function closeAll(){document.querySelectorAll(".modal").forEach(m=>m.classList.remove("on"))}
function openNew(){
  document.getElementById("mId").value="";document.getElementById("mN").value="";
  document.getElementById("mS").value="";document.getElementById("mQ").value="";
  document.getElementById("mP").value="";document.getElementById("btnDel").style.display="none";
  document.getElementById("modProd").classList.add("on");
}
function editProd(id){
  let p=prods.find(x=>x.id==id);
  document.getElementById("mId").value=p.id;document.getElementById("mN").value=p.n;
  document.getElementById("mS").value=p.s;document.getElementById("mQ").value=p.q;
  document.getElementById("mP").value=p.p;document.getElementById("btnDel").style.display="block";
  document.getElementById("modProd").classList.add("on");
}
function saveProd(){
  let id=document.getElementById("mId").value,n=document.getElementById("mN").value;
  let s=document.getElementById("mS").value||"SKU",q=Number(document.getElementById("mQ").value)||0,p=Number(document.getElementById("mP").value)||0;
  if(!n)return alert("Nome?");
  if(id){let x=prods.find(i=>i.id==id);x.n=n;x.s=s;x.q=q;x.p=p}
  else{prods.unshift({id:Date.now(),n,s,q,m:5,p})}
  sync();closeAll();
}
function delProd(){prods=prods.filter(x=>x.id!=document.getElementById("mId").value);sync();closeAll()}
function openMov(t){
  movType=t;document.getElementById("movSel").innerHTML=prods.map(p=>`<option value="${p.id}">${p.n} (${p.q})</option>`).join("");
  document.getElementById("modMov").classList.add("on");
}
function saveMov(){
  let p=prods.find(x=>x.id==document.getElementById("movSel").value),q=Number(document.getElementById("movQ").value);
  if(movType=="out"&&p.q<q)return alert("Sem estoque!");
  p.q+=movType=="in"?q:-q;hist.unshift({p:p.n,q:(movType=="in"?"+":"-")+q});sync();closeAll();
}
function simScan(){cur=prods[Math.floor(Math.random()*prods.length)];updScan()}
function updScan(){if(cur){document.getElementById("scName").innerText=cur.n;document.getElementById("scSku").innerText=cur.s;document.getElementById("scQty").innerText=cur.q}}
function chgD(v){if(delta+v>=1){delta+=v;document.getElementById("scDelta").innerText=delta}}
function addScan(){cur.q+=delta;hist.unshift({p:cur.n,q:"+"+delta});updScan();sync();alert("Adicionado!")}
function csvOut(){
  let c="Nome,Qtd,Preco\n"+prods.map(p=>`${p.n},${p.q},${p.p}`).join("\n");
